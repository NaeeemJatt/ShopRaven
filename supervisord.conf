[supervisord]
nodaemon=true
user=user
logfile=/tmp/supervisor/supervisord.log
pidfile=/tmp/supervisor/supervisord.pid

[program:redis]
command=redis-server --port 6379 --dir /app/data --daemonize no
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app/backend
environment=PYTHONPATH="/app/backend"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A app.celery_app.celery_app worker --loglevel=info -B
directory=/app/backend
environment=PYTHONPATH="/app/backend"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:orchestrator]
command=node src/server.js
directory=/app/orchestrator
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

